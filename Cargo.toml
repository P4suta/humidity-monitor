[workspace]
members = ["crates/switchbot-meter"]
resolver = "3"

[package]
name = "humidity-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/humidity-monitor"
description = "Record SwitchBot temperature and humidity over Bluetooth on Linux"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
] }
clap = { version = "4", features = ["derive"] }
switchbot-meter = { path = "crates/switchbot-meter" }
futures-util = "0.3"
maud = "0.27"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "time",
  "signal",
] }
zbus = { version = "6.5", default-features = false, features = [
  "proxy",
  "tokio",
] }

[dev-dependencies]
zbus = { version = "6.5", default-features = false, features = [
  "service",
  "tokio",
] }
serde_json = "1"
tempfile = "3"
